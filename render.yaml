# render.yaml — Render Blueprint for KisanMitra Backend
# Deploy: Connect GitHub repo → Render auto-detects this file

services:
  - type: web
    name: kishanmitra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./kisanmitra.db"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DEFAULT_STATE
        value: "Uttarakhand"
      - key: GEMINI_API_KEY
        sync: false  # User must set manually in Render dashboard
      - key: RAG_LLM_PROVIDER
        value: "gemini"
      - key: RAG_LLM_MODEL
        value: "gemini-3.5-flash-lite"
      - key: RAG_EMBEDDING_PROVIDER
        value: "fast"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.0"
